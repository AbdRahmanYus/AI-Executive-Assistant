<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Executive Assistant</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <span class="logo-icon">⬡</span>
                    <span class="logo-text">AXAI</span>
                </div>
                <nav class="nav">
                    <button class="nav-item active" data-tab="chat" onclick="switchTab('chat')" title="Chat">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                        <span>Chat</span>
                    </button>
                    <button class="nav-item" data-tab="gmail" onclick="switchTab('gmail')" title="Gmail">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <span>Gmail</span>
                    </button>
                    <button class="nav-item" data-tab="calendar" onclick="switchTab('calendar')" title="Calendar">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                        <span>Calendar</span>
                    </button>
                    <button class="nav-item" data-tab="drive" onclick="switchTab('drive')" title="Drive">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                        <span>Drive</span>
                    </button>
                    <button class="nav-item" data-tab="docs" onclick="switchTab('docs')" title="Docs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><line x1="10" x2="8" y1="9" y2="9"/></svg>
                        <span>Docs</span>
                    </button>
                </nav>
            </div>
            <div class="sidebar-bottom">
                <button class="nav-item" id="clearBtn" title="Clear chat" onclick="clearChat()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                    <span>Clear</span>
                </button>
                <div class="user-profile" id="userProfile">
                    <div class="avatar" id="userAvatar">?</div>
                    <div class="user-info">
                        <span class="user-name" id="userName">Loading...</span>
                        <span class="user-email" id="userEmail"></span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <h1>AI Executive Assistant</h1>
                    <div class="status">
                        <span class="status-dot"></span>
                        <span>Agent Active</span>
                    </div>
                </div>
                <div class="header-right" id="authSection">
                    <button class="btn-login" onclick="login()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
                        Sign in with Google
                    </button>
                </div>
            </header>

            <!-- Chat -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">⬡</div>
                    <h2>Your AI Executive Assistant</h2>
                    <p>Sign in with Google to start automating your workspace</p>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="sendQuick('Show me my recent emails')">📧 Recent Emails</button>
                        <button class="quick-btn" onclick="sendQuick('Show my upcoming events')">📅 Upcoming Events</button>
                        <button class="quick-btn" onclick="sendQuick('List my Drive files')">📁 Drive Files</button>
                        <button class="quick-btn" onclick="sendQuick('Create a new document called Meeting Notes')">📝 New Document</button>
                    </div>
                </div>
                <div id="messages"></div>
            </div>

            <!-- Tab Content -->
            <div id="tabContainer" class="tab-container" style="display:none;"></div>

            <!-- Input -->
            <div class="input-area" id="inputArea">
                <div class="input-wrapper">
                    <textarea
                        id="messageInput"
                        placeholder="Ask your assistant anything... Send email, schedule meeting, find files..."
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                    </button>
                </div>
                <p class="input-hint">Press Enter to send · Shift+Enter for new line</p>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
